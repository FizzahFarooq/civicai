<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CivicAI - From citizen reports to smarter cities</title>
  <meta name="description" content="Photograph a pothole, broken streetlight or leaking pipe. CivicAI identifies it, ranks how urgent it is, merges duplicates and sends it to the right department.">
  <script>
    // set theme before paint to avoid a flash
    (function () {
      var t = localStorage.getItem('civicai_theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23005C3B'/%3E%3Crect x='14' y='4' width='4' height='7' fill='%23FFC20E'/%3E%3Crect x='14' y='14' width='4' height='7' fill='%23FFC20E'/%3E%3Crect x='14' y='24' width='4' height='5' fill='%23FFC20E'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/vendor/fonts/barlow/400.css">
  <link rel="stylesheet" href="/vendor/fonts/barlow/500.css">
  <link rel="stylesheet" href="/vendor/fonts/barlow/700.css">
  <link rel="stylesheet" href="/vendor/fonts/barlow-condensed/700.css">
  <link rel="stylesheet" href="/vendor/fonts/barlow-condensed/800.css">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="#/" aria-label="CivicAI home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#fff"/><rect x="14" y="4" width="4" height="7" fill="#005C3B"/><rect x="14" y="14" width="4" height="7" fill="#005C3B"/><rect x="14" y="24" width="4" height="5" fill="#005C3B"/></svg>
        <span>CivicAI</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/report" data-nav="report">Report a problem</a>
        <a href="#/track" data-nav="track">Track a report</a>
        <a href="#/dashboard" data-nav="dashboard">Authority dashboard</a>
      </nav>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to dark theme">
        <span class="theme-ico" aria-hidden="true"></span><span class="theme-txt">Dark</span>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="footer">
    <div class="wrap footer-in">
      <p><strong>CivicAI</strong> turns citizen photos into data cities can prioritise, predict and verify.</p>
      <p class="small">All reports are stored in a local database on this server.</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
